<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="TRIAGE-1 runs on one server in the customer's environment. It reads the ticket queue from one ticketing tool, checks and changes Windows and Linux servers with short-lived credentials, and keeps its data in a local PostgreSQL database, using a language model hosted by the customer." font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="none" stroke="none">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <g fill="#1d2330" text-anchor="middle">
    <text x="500" y="26" font-size="16" font-weight="600">TRIAGE-1 architecture</text>
  </g>

  <!-- people -->
  <rect x="380" y="44" width="240" height="44" rx="8" fill="#f3f5f9" stroke="#8a93a6"/>
  <text x="500" y="64" text-anchor="middle" fill="#1d2330" font-weight="600">Engineers, approvers, admins</text>
  <text x="500" y="80" text-anchor="middle" fill="#4a5163">web browser</text>
  <line x1="500" y1="88" x2="500" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="508" y="112" fill="#4a5163">HTTPS through your reverse proxy</text>

  <!-- TRIAGE-1 server -->
  <rect x="300" y="130" width="400" height="250" rx="10" fill="#eef4ff" stroke="#2f6fde" stroke-width="2"/>
  <text x="500" y="152" text-anchor="middle" fill="#1d4fae" font-weight="700" font-size="14">TRIAGE-1 server (Windows service or Docker)</text>
  <g fill="#ffffff" stroke="#9db6e6">
    <rect x="318" y="166" width="174" height="40" rx="6"/><rect x="508" y="166" width="174" height="40" rx="6"/>
    <rect x="318" y="216" width="174" height="40" rx="6"/><rect x="508" y="216" width="174" height="40" rx="6"/>
    <rect x="318" y="266" width="174" height="40" rx="6"/><rect x="508" y="266" width="174" height="40" rx="6"/>
    <rect x="318" y="318" width="364" height="44" rx="6"/>
  </g>
  <g fill="#1d2330" text-anchor="middle">
    <text x="405" y="190">Web app and API</text>
    <text x="595" y="190">Approver chat</text>
    <text x="405" y="234">Triage agent</text><text x="405" y="249" fill="#4a5163" font-size="11">playbooks per problem type</text>
    <text x="595" y="234">Safety controls</text><text x="595" y="249" fill="#4a5163" font-size="11">risk levels, approvals, guards</text>
    <text x="405" y="284">Licence check</text><text x="405" y="299" fill="#4a5163" font-size="11">offline, signed key</text>
    <text x="595" y="284">Backups</text><text x="595" y="299" fill="#4a5163" font-size="11">encrypted, your retention</text>
    <text x="500" y="337">Audit log and ticket work notes</text>
    <text x="500" y="353" fill="#4a5163" font-size="11">every action, who asked, who approved</text>
  </g>

  <!-- left -->
  <rect x="30" y="150" width="210" height="92" rx="8" fill="#f3f5f9" stroke="#8a93a6"/>
  <g fill="#1d2330" text-anchor="middle">
    <text x="135" y="172" font-weight="600">Your ticketing tool</text>
    <text x="135" y="192" fill="#4a5163" font-size="11">ServiceNow, Jira Service Management,</text>
    <text x="135" y="207" fill="#4a5163" font-size="11">BMC Helix / Remedy, ManageEngine,</text>
    <text x="135" y="222" fill="#4a5163" font-size="11">Freshservice (one per licence)</text>
  </g>
  <line x1="244" y1="186" x2="296" y2="186" stroke="#555" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="270" y="176" text-anchor="middle" fill="#4a5163" font-size="11">queue,</text>
  <text x="270" y="204" text-anchor="middle" fill="#4a5163" font-size="11">notes</text>

  <rect x="30" y="282" width="210" height="58" rx="8" fill="#f3f5f9" stroke="#8a93a6"/>
  <text x="135" y="305" text-anchor="middle" fill="#1d2330" font-weight="600">Directory</text>
  <text x="135" y="322" text-anchor="middle" fill="#4a5163" font-size="11">Active Directory / LDAP, CMDB</text>
  <line x1="244" y1="311" x2="296" y2="311" stroke="#555" stroke-width="1.5" marker-start="url(#a)"/>
  <text x="270" y="301" text-anchor="middle" fill="#4a5163" font-size="11">sign-in</text>

  <!-- right -->
  <rect x="760" y="150" width="210" height="92" rx="8" fill="#f3f5f9" stroke="#8a93a6"/>
  <g fill="#1d2330" text-anchor="middle">
    <text x="865" y="172" font-weight="600">Your servers</text>
    <text x="865" y="194" fill="#4a5163" font-size="11">Windows over WinRM</text>
    <text x="865" y="210" fill="#4a5163" font-size="11">Linux over SSH</text>
    <text x="865" y="226" fill="#4a5163" font-size="11">from CMDB, AWS or a list</text>
  </g>
  <line x1="704" y1="196" x2="756" y2="196" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="730" y="186" text-anchor="middle" fill="#4a5163" font-size="11">checks,</text>
  <text x="730" y="214" text-anchor="middle" fill="#4a5163" font-size="11">changes</text>

  <rect x="760" y="282" width="210" height="58" rx="8" fill="#f3f5f9" stroke="#8a93a6"/>
  <text x="865" y="303" text-anchor="middle" fill="#1d2330" font-weight="600">Credential store</text>
  <text x="865" y="320" text-anchor="middle" fill="#4a5163" font-size="11">built-in, CyberArk CCP, AWS Secrets Mgr</text>
  <line x1="756" y1="311" x2="704" y2="311" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="730" y="301" text-anchor="middle" fill="#4a5163" font-size="11">checkout</text>

  <!-- bottom -->
  <g fill="#f3f5f9" stroke="#8a93a6">
    <rect x="60" y="450" width="190" height="64" rx="8"/><rect x="290" y="450" width="190" height="64" rx="8"/>
    <rect x="520" y="450" width="190" height="64" rx="8"/><rect x="750" y="450" width="190" height="64" rx="8"/>
  </g>
  <g fill="#1d2330" text-anchor="middle">
    <text x="155" y="476" font-weight="600">PostgreSQL</text><text x="155" y="494" fill="#4a5163" font-size="11">on the same server</text>
    <text x="385" y="476" font-weight="600">Language model</text><text x="385" y="494" fill="#4a5163" font-size="11">hosted by you</text>
    <text x="615" y="476" font-weight="600">Mail</text><text x="615" y="494" fill="#4a5163" font-size="11">SMTP, Amazon SES or SNS</text>
    <text x="845" y="476" font-weight="600">Backup copy</text><text x="845" y="494" fill="#4a5163" font-size="11">second disk or share</text>
  </g>
  <g stroke="#555" stroke-width="1.5">
    <path d="M360 380 L155 446" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M450 380 L385 446" marker-end="url(#a)"/>
    <path d="M550 380 L615 446" marker-end="url(#a)"/>
    <path d="M640 380 L845 446" marker-end="url(#a)"/>
  </g>
  <g fill="#4a5163" font-size="11" text-anchor="middle">
    <text x="232" y="414">data</text><text x="400" y="420">prompts</text>
    <text x="604" y="420">owner mail</text><text x="770" y="414">encrypted files</text>
  </g>
  <text x="500" y="560" text-anchor="middle" fill="#4a5163" font-size="12">No connection to the vendor: the licence is checked on your server, and nothing is sent home.</text>
  <text x="500" y="580" text-anchor="middle" fill="#4a5163" font-size="12">Data leaves your network only to services you choose to connect, such as a cloud ticketing tool or Amazon SES.</text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/css/theme.css?v=6">
    <script src="/static/js/theme.js?v=6"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change password · TRIAGE-1</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/static/icons/brand.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/brand-32.png">
    <link rel="apple-touch-icon" href="/static/icons/brand-180.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: var(--font-ui); background: var(--bg); color: var(--text); }
        .card { background: var(--panel); border: 1px solid var(--border); box-shadow: 0 12px 40px rgba(0, 0, 0, .25); }
        .field-label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; color: var(--muted); }
        .field-input { width: 100%; padding: 11px 14px; border-radius: 10px; font-size: 16px; color: var(--text);
            background: var(--bg); border: 1px solid var(--border-strong); outline: none; }
        .field-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
        .field-input[aria-invalid="true"] { border-color: var(--danger); }
        .btn { background: var(--accent); color: var(--on-accent); }
        .btn:hover:not(:disabled) { background: var(--accent-strong); }
        .btn:disabled { opacity: .7; cursor: wait; }
        .err { background: var(--danger-bg); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">
    <div class="card p-8 rounded-2xl w-full max-w-sm">
        <h1 class="text-[22px] font-bold tracking-tight">Change your password</h1>
        <p class="text-[14px] mt-1 mb-6" style="color: var(--muted)">Use at least 12 characters. It must differ from the current one.</p>
        <form id="pw-form" class="flex flex-col gap-5">
            <div>
                <label for="cur" class="field-label">Current password</label>
                <input type="password" id="cur" required autocomplete="current-password" class="field-input">
            </div>
            <div>
                <label for="new" class="field-label">New password</label>
                <input type="password" id="new" required minlength="12" autocomplete="new-password" class="field-input">
            </div>
            <div>
                <label for="confirm" class="field-label">Confirm new password</label>
                <input type="password" id="confirm" required autocomplete="new-password" class="field-input">
            </div>
            <div id="msg" role="alert" class="err rounded-lg px-3 py-2.5 text-[14px] hidden"></div>
            <button type="submit" id="go" class="btn w-full py-3 rounded-lg font-semibold text-[16px]">Change password</button>
        </form>
        <p class="mt-6 text-center text-[13px]"><a href="#" id="signout" style="color: var(--subtle)">Sign out</a></p>
    </div>
    <script>
        const form = document.getElementById('pw-form'), msg = document.getElementById('msg'), go = document.getElementById('go');
        const cur = document.getElementById('cur'), np = document.getElementById('new'), cf = document.getElementById('confirm');
        function fail(text, field) {
            msg.textContent = text; msg.classList.remove('hidden');
            [cur, np, cf].forEach((i) => i.removeAttribute('aria-invalid'));
            if (field) { field.setAttribute('aria-invalid', 'true'); field.focus(); }
        }
        document.getElementById('signout').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
            location.href = '/static/login.html';
        });
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.classList.add('hidden');
            if (np.value.length < 12) return fail('The new password must be at least 12 characters.', np);
            if (np.value !== cf.value) return fail('The new passwords do not match.', cf);
            go.disabled = true;
            try {
                const res = await fetch('/api/auth/change-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ current_password: cur.value, new_password: np.value })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    const me = await fetch('/api/auth/me').then((r) => r.json()).catch(() => ({}));
                    location.href = me.home || '/';
                    return;
                }
                if (res.status === 401) { location.href = '/static/login.html'; return; }
                fail(typeof data.detail === 'string' ? data.detail : 'Could not change the password.', res.status === 403 ? cur : np);
            } catch (err) {
                fail('Cannot reach the server. Try again.');
            } finally { go.disabled = false; }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · TRIAGE-1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Sans', sans-serif; background-color: #0A0D10; color: #E8ECF1; }
        .glass-panel { background: rgba(18, 22, 28, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(46, 55, 68, 0.8); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4); }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">
    <div class="glass-panel p-8 rounded-2xl w-full max-w-sm">
        <div class="flex items-center gap-4 mb-8">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#FFC533] to-[#FF9500] flex items-center justify-center text-[#0A0D10] font-bold">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            </div>
            <h1 class="text-xl font-bold tracking-tight">TRIAGE-1</h1>
        </div>
        
        <form id="login-form" class="flex flex-col gap-4">
            <div>
                <label class="block text-[12px] font-mono uppercase tracking-wider text-gray-400 mb-1.5">Username</label>
                <input type="text" id="username" required class="w-full rounded-lg bg-[#0A0D10] border border-[#2E3744] px-3 py-2.5 text-[14px] outline-none focus:border-[#FFB000]">
            </div>
            <div>
                <label class="block text-[12px] font-mono uppercase tracking-wider text-gray-400 mb-1.5">Password</label>
                <input type="password" id="password" required class="w-full rounded-lg bg-[#0A0D10] border border-[#2E3744] px-3 py-2.5 text-[14px] outline-none focus:border-[#FFB000]">
            </div>
            <div id="error-msg" class="text-red-400 text-[13px] hidden"></div>
            <button type="submit" id="submit-btn" class="mt-2 w-full py-2.5 rounded-lg bg-[#FFB000] hover:bg-[#E6A000] text-black font-semibold text-[14px] transition-colors">Sign In</button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const err = document.getElementById('error-msg');
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            err.classList.add('hidden');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    window.location.href = data.role === 'admin' ? '/admin' : '/';
                } else {
                    const errorData = await res.json();
                    err.textContent = errorData.detail || 'Login failed';
                    err.classList.remove('hidden');
                }
            } catch (error) {
                err.textContent = 'Network error. Please try again.';
                err.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
